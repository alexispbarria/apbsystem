<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logotipo vectorial editable: APB Sales Core
  =========================================================
  Para personalizar colores, modifica los <stop> en <defs>.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" role="img" aria-label="APB Sales Core Logo">
    <defs>
        <!-- Gradiente principal neón (Cian -> Azul -> Violeta) -->
        <linearGradient id="apbGradPrimary" x1="14" y1="10" x2="106" y2="110" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00E5FF"/>
            <stop offset="52%" stop-color="#3B82F6"/>
            <stop offset="100%" stop-color="#8B5CF6"/>
        </linearGradient>

        <!-- Gradiente de brillo interno del núcleo -->
        <linearGradient id="apbGradCore" x1="30" y1="92" x2="88" y2="26" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="55%" stop-color="#00E5FF"/>
            <stop offset="100%" stop-color="#E0F2FE"/>
        </linearGradient>

        <!-- Relleno oscuro translúcido del escudo hexagonal -->
        <radialGradient id="apbBgGlow" cx="50%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#13294B" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#070D1D" stop-opacity="0.98"/>
        </radialGradient>

        <!-- Resplandor sutil del nodo superior -->
        <filter id="apbSoftGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="3.2" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Escudo hexagonal exterior -->
    <path d="M60 7 L104 32.5 C106.5 34 108 36.6 108 39.5 V80.5 C108 83.4 106.5 86 104 87.5 L60 113 L16 87.5 C13.5 86 12 83.4 12 80.5 V39.5 C12 36.6 13.5 34 16 32.5 Z"
          fill="url(#apbBgGlow)"
          stroke="url(#apbGradPrimary)"
          stroke-width="2.6"/>

    <!-- Marco geométrico interior (estilo HUD) -->
    <path d="M60 16 L99 38.5 V81.5 L60 104 L21 81.5 V38.5 Z"
          stroke="url(#apbGradPrimary)"
          stroke-opacity="0.28"
          stroke-width="1.2"
          stroke-dasharray="4 3"/>

    <!-- Arco orbital comercial -->
    <path d="M29 74 C40 58, 74 52, 91 40"
          stroke="url(#apbGradPrimary)"
          stroke-width="2"
          stroke-linecap="round"
          stroke-opacity="0.55"/>

    <!-- Monograma futurista "A" + vector ascendente de ventas -->
    <path d="M35 84 L57.2 34.5 C58.3 32 61.7 32 62.8 34.5 L85 84"
          stroke="url(#apbGradCore)"
          stroke-width="6.2"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Barra de impulso / gráfica ascendente interna -->
    <path d="M45 68 L57 60 L66 65 L82 47"
          stroke="#00E5FF"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#apbSoftGlow)"/>

    <!-- Punta direccional de crecimiento -->
    <path d="M74.5 46.2 L83.2 46 L82.8 54.8"
          stroke="#E0F2FE"
          stroke-width="3.2"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Nodo Nexus luminoso en el vértice superior -->
    <circle cx="60" cy="25" r="4.2" fill="#00E5FF" filter="url(#apbSoftGlow)"/>
    <circle cx="60" cy="25" r="1.8" fill="#FFFFFF"/>

    <!-- Puntos de anclaje inferiores -->
    <circle cx="35" cy="84" r="2.2" fill="#38BDF8"/>
    <circle cx="85" cy="84" r="2.2" fill="#8B5CF6"/>
</svg>
